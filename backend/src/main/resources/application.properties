spring.application.name=data-lake-filter-backend

server.port=8080

# Limites de carga configurables. Los valores predeterminados de Spring Boot
# (1 MB por archivo y 10 MB por peticion) son insuficientes para los datasets.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:250MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:260MB}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/ludah}
spring.datasource.username=${DATABASE_USERNAME:ludah}
spring.datasource.password=${DATABASE_PASSWORD:ludah123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

minio.url=http://localhost:9000
minio.access-key=admin
minio.secret-key=admin123
minio.bucket=data-lake
